name: Branding Guard

# Fail-fast gate for upstream branding leaks in product code (legacy agent
# names and affiliated product marks). Runs standalone on every PR — including
# fork PRs — so a leak is reported in seconds without waiting for the full CI
# matrix. The same script also runs inside the ci.yml `check` job as the
# authoritative gate.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  branding-guard:
    name: Branding guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Check branding leaks
        run: bun scripts/check-branding.ts
